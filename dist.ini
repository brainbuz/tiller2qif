name    = Finance-Tiller2QIF
version = 1.22x
abstract = Convert Tiller CSV exports to QIF
author  = cpan@brainbuz.org
license = GPL_3
copyright_holder = John Karr

[GatherDir]

[PkgVersion]
[PruneCruft]
[ManifestSkip]
[MetaYAML]
[MetaJSON]
[MetaResources]
repository.url = https://github.com/brainbuz/tiller2qif
repository.web = https://github.com/brainbuz/tiller2qif
repository.type = git
bugtracker.web = https://github.com/brainbuz/tiller2qif/issues
[ExecDir]
[ShareDir]
; Supported: Strawberry Perl on Windows, macOS, Linux and BSD. Other OSes
; (Cygwin, Haiku, Solaris, AIX ...) are not tested or supported by the author,
; but users may still install. Only under CPAN Testers (AUTOMATED_TESTING) does
; Makefile.PL die with "OS unsupported", so the report is NA rather than FAIL.
[MakeMaker::Awesome]
delimiter = |
header = |BEGIN {
header = |  my %supported = map { $_ => 1 } qw(linux darwin MSWin32 freebsd netbsd openbsd dragonfly);
header = |  unless ($supported{$^O}) {
header = |    die "OS unsupported\n" if $ENV{AUTOMATED_TESTING};
header = |    warn "Warning: $^O is not a supported platform; installing anyway.\n";
header = |  }
header = |}

[Manifest]
; [License]
[TestRelease]
[ConfirmRelease]
[UploadToCPAN]
[RunExtraTests]

; Inject lib/Finance/Tiller2QIF.pod at the '## POD ##' placeholder in
; both the main module and the bin script. Source POD lives in the
; .pod file; placeholders in the .pm/.pl files are replaced at build.
[Run::AfterBuild]
run = perl bin/inject_pod.pl Tiller2QIF.pod %d/lib/Finance/Tiller2QIF.pm %d/bin/tiller2qif
run = pod2markdown Tiller2QIF.pod README.md

; bin/inject_pod.pl is a build-time helper, not part of the dist.
[PruneFiles]
filename = bin/inject_pod.pl
filename = Tiller2QIF.pod

[Prereqs]
perl = 5.036
DBI = 0
Path::Tiny = 0
Text::CSV = 0
DBD::SQLite = 0
DateTime::Format::Flexible = 0
Cpanel::JSON::XS = 0
Getopt::Long::Descriptive = 0
Win32::ShellQuote = 0.003001

[Prereqs / TestRequires]
Test2::V0 = 0
Test2::Bundle::More = 0
Test2::Tools::Exception = 0
Capture::Tiny = 0
