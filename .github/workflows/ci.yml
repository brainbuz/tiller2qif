name: CI

on:
  push:
    branches: ["main", "brainbuz" ]
  pull_request:
    branches: ["main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl: ['5.36', '5.38', '5.40', '5.42', '5.44']

    name: Perl ${{ matrix.perl }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Perl ${{ matrix.perl }}
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}

      - name: Install App::cpm
        run: cpanm --notest --quiet App::cpm

      - name: Install dependencies
        run: cpm install -g --show-build-log-on-failure --with-test

      - name: Run tests
        run: prove -l t

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        perl: ['5.36', '5.42']

    name: macOS Perl ${{ matrix.perl }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Perl ${{ matrix.perl }}
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}

      - name: Install App::cpm
        run: cpanm --notest --quiet App::cpm

      - name: Install dependencies
        run: cpm install -g --show-build-log-on-failure --with-test

      - name: Run tests
        run: prove -l t

  freebsd:
    runs-on: ubuntu-latest
    name: FreeBSD system Perl

    steps:
      - uses: actions/checkout@v6

      - name: Test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y perl5 p5-App-cpanminus gmake
            pw useradd -n tester -m -s /bin/sh
          run: |
            cpanm --notest --quiet --installdeps .
            # Run the tests as an unprivileged user like CPAN Testers does;
            # root ignores file permissions and breaks the "not writable" tests.
            chown -R tester "$GITHUB_WORKSPACE"
            su tester -c "cd '$GITHUB_WORKSPACE' && id && prove -l t"

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Match the versions in the failing CPAN Testers reports and the
        # minimum supported Perl version.
        perl: ['5.36', '5.42']

    name: Windows Perl ${{ matrix.perl }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Strawberry Perl ${{ matrix.perl }}
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
          distribution: strawberry

      - name: Install App::cpm
        run: cpanm --notest --quiet App::cpm

      - name: Install dependencies
        run: cpm install -g --show-build-log-on-failure --with-test

      - name: Run tests
        run: prove -l t
